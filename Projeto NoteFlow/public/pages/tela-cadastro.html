<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFlow | Cadastro</title>

<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/tela-cadastro.css">
<link rel="icon" href="../assets/img/NoteFlow-logo-circle.png">

</head>
<body class="light">
    
    <div class="container">

        <div class="left-side">
            <div class="logo"><img src="../assets/img/NoteFlow-logo-circle.png"></div>

            <div class="text-content">
                <h1>Organize suas ideias.</h1>
                <h2>Acesse de qualquer lugar.</h2>

                <p>Já tem uma conta?</p>

                <a class="login-btn" href="tela-login.html">Entrar</a>
            </div>
        </div>

        <div class="right-side">
            <div class="form-box">
                <h2>Criar conta</h2>
                <p>Preencha os dados abaixo para se cadastrar.</p>

                <form id="registerForm">

                    <label for="username">Nome de usuário</label>
                    <input type="text" id="username" placeholder="Digite seu nome de usuário" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>

                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>

                    <button type="submit" class="register-btn">Cadastrar</button>

                </form>
            </div>
        </div>

    </div>

    <!-- Botão de tema -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙 Tema escuro</button>

    <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/tela-cadastro.js"></script>

</body>
</html>
