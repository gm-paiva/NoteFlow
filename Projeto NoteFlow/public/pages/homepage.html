<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow | Home</title>
  <link rel="icon" href="../assets/img/NoteFlow-logo-circle.png">
  <link rel="stylesheet" href="../assets/css/homepage.css">
</head>
<body class="light">

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo-wrap">
      <span class="logo-icon"><img src="../assets/img/NoteFlow-logo-transparent.png"></span>
      <h2 class="logo">Note<span>Flow</span></h2>
    </div>

    <button class="btn-primary" onclick="abrirCriacao()">
      <span class="plus">+</span> Nova nota
    </button>

    <nav>
      <ul>
        <li class="active" id="nav-todas" onclick="filtrar('todas')">
          <span class="nav-icon">◎</span> Todas as notas
        </li>
        <li id="nav-fixadas" onclick="filtrar('fixadas')">
          <span class="nav-icon">⊙</span> Fixadas
        </li>
        <li id="nav-arquivadas" onclick="filtrar('arquivadas')">
          <span class="nav-icon">◷</span> Arquivadas
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button id="themeToggle" onclick="toggleTheme()">🌙 Tema escuro</button>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="content">

    <!-- Topbar -->
    <header class="topbar">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Buscar notas..." oninput="buscar(this.value)">
      </div>
    </header>

    <!-- Criação rápida inline -->
    <div class="quick-create" id="quickCreate">
      <input type="text" id="quickTitle" placeholder="Criar uma nota..." onfocus="expandirCriacao()" />
      <div class="quick-actions" id="quickActions">
        <textarea id="quickBody" placeholder="Escreva sua nota..."></textarea>
        <div class="quick-footer">
          <div class="color-dots" id="quickColors">
            <span class="dot" style="background:#ffffff" onclick="selecionarCor('#ffffff',this)"></span>
            <span class="dot" style="background:#fef9c3" onclick="selecionarCor('#fef9c3',this)"></span>
            <span class="dot" style="background:#fce7f3" onclick="selecionarCor('#fce7f3',this)"></span>
            <span class="dot" style="background:#dcfce7" onclick="selecionarCor('#dcfce7',this)"></span>
            <span class="dot" style="background:#dbeafe" onclick="selecionarCor('#dbeafe',this)"></span>
            <span class="dot" style="background:#ede9fe" onclick="selecionarCor('#ede9fe',this)"></span>
          </div>
          <div class="quick-btns">
            <button class="btn-fechar" onclick="fecharCriacao()">Fechar</button>
            <button class="btn-salvar" onclick="salvarNota()">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Grid de notas -->
    <section class="notes-section">
      <div class="notes-label" id="labelFixadas">
        <span>⊙ Fixadas</span>
      </div>
      <div class="grid" id="gridFixadas"></div>

      <div class="notes-label" id="labelOutras">
        <span>◎ Notas</span>
      </div>
      <div class="grid" id="gridNotas"></div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">◈</div>
        <p>Nenhuma nota ainda.</p>
        <small>Crie sua primeira nota acima!</small>
      </div>
    </section>

  </main>
</div>

<!-- Modal editar nota -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModalFora(event)">
  <div class="modal" id="modalNota">
    <input type="text" id="modalTitle" placeholder="Título" class="modal-title-input" />
    <textarea id="modalBody" placeholder="Escreva sua nota..." class="modal-body-input"></textarea>
    <div class="modal-footer">
      <div class="color-dots" id="modalColors">
        <span class="dot" style="background:#ffffff" onclick="selecionarCorModal('#ffffff',this)"></span>
        <span class="dot" style="background:#fef9c3" onclick="selecionarCorModal('#fef9c3',this)"></span>
        <span class="dot" style="background:#fce7f3" onclick="selecionarCorModal('#fce7f3',this)"></span>
        <span class="dot" style="background:#dcfce7" onclick="selecionarCorModal('#dcfce7',this)"></span>
        <span class="dot" style="background:#dbeafe" onclick="selecionarCorModal('#dbeafe',this)"></span>
        <span class="dot" style="background:#ede9fe" onclick="selecionarCorModal('#ede9fe',this)"></span>
      </div>
      <div class="modal-actions">
        <button class="btn-icon" id="btnFixarModal" onclick="fixarNota()" title="Fixar">⊙</button>
        <button class="btn-icon btn-arquivar" onclick="arquivarNota()" title="Arquivar">◷</button>
        <button class="btn-icon btn-deletar" onclick="deletarNota()" title="Excluir">✕</button>
        <button class="btn-salvar" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/homepage.js"></script>
</body>
</html>
