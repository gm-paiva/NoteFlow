<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoteFlow | Login</title>

  <link rel="stylesheet" href="../assets/css/main.css"/>
  <link rel="stylesheet" href="../assets/css/tela-login.css"/>
  <link rel="icon" href="../assets/img/NoteFlow-logo-circle.png">
</head>
<body class="light">

  <aside class="left">
    <div class="brand">
     <img src="../assets/img/NoteFlow-logo-transparent.png">

      <div class="brand-name">Note<span>Flow</span></div>
      <p class="tagline">Organize suas ideias.<br/>Acesse de qualquer lugar.</p>
    </div>
  </aside>

  <main class="right">

    <div class="top-bar">
      Não tem uma conta?<a href="tela-cadastro.html">Cadastrar</a>
    </div>

    <div class="form-header">
      <h1>Bem-vindo de volta!</h1>
      <p>Entre com seus dados para acessar sua conta.</p>
    </div>

    <form id="registerForm">

      <div>
        <!-- Email -->
        <div class="field">
          <label for="email">E-mail</label>
          <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input id="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required/>
        </div>
      </div>

      <!-- Senha -->
      <div class="field">
        <div class="field-row">
          <label for="password">Senha</label>
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required/>
          <button class="eye-btn" type="button" onclick="togglePassword()" aria-label="Mostrar senha">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

    </form>

      <!-- Lembrar de mim -->
      <label class="remember">
        <input type="checkbox" id="remember"/>
        <div class="custom-check">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span>Lembrar de mim</span>
      </label>

      <button class="btn-entrar" type="submit">Entrar</button>

      <div class="divider">ou continue com</div>

      <!-- Google -->
      <button class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
        </svg>
        Entrar com Google
      </button>
    </div>

  </main>

  <!-- Botão de tema -->
  <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙 Tema escuro</button>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/tela-login.js"></script>
</body>
</html>
